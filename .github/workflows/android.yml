name: Android CI / Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/DigmaWatchApp-debug.apk || true
          cp app/build/outputs/apk/release/*.apk release-apks/DigmaWatchApp-release.apk || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigmaWatchApp-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/DigmaWatchApp-release.apk
            release-apks/DigmaWatchApp-debug.apk
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
