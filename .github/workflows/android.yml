name: Android CI / Release Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          elif [ -f "keystore/release.jks" ]; then
            echo "Using tracked keystore/release.jks from repository..."
          else
            echo "No custom keystore found"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug and Release APKs
        run: |
          set -eo pipefail
          ./gradlew assembleDebug assembleRelease test --stacktrace 2>&1 | tee build.log || {
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          KEYSTORE_PATH: "keystore/release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/DigmaWatchApp-debug.apk \; || true
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-apks/DigmaWatchApp-release.apk \; || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigmaWatchApp-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/DigmaWatchApp-release.apk
            release-apks/DigmaWatchApp-debug.apk
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
